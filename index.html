<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Toki's Music</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app">

        <!-- HEADER -->
        <header class="header">
            <div>
                <h1>Toki's Music</h1>
                <p>Your personal music player</p>
            </div>
        </header>


        <!-- SEARCH -->
        <section class="search-box">
            <input
                type="search"
                id="searchInput"
                placeholder="Cari lagu..."
            >
        </section>


        <!-- NOW PLAYING -->
        <section class="now-playing">

            <div class="cover-container">
                <img
                    id="cover"
                    src="covers/default.jpg"
                    alt="Cover lagu"
                >
            </div>

            <div class="song-info">
                <h2 id="songTitle">Belum ada lagu</h2>
                <p id="artist">Toki's Music</p>
            </div>

            <!-- PROGRESS -->
            <div class="progress-area">
                <span id="currentTime">0:00</span>

                <input
                    type="range"
                    id="progress"
                    min="0"
                    max="100"
                    value="0"
                >

                <span id="duration">0:00</span>
            </div>

            <!-- CONTROLS -->
            <div class="controls">

                <button id="shuffleBtn" type="button">
                    🔀
                </button>

                <button id="prevBtn" type="button">
                    ⏮
                </button>

                <button id="playBtn" type="button">
                    ▶
                </button>

                <button id="nextBtn" type="button">
                    ⏭
                </button>

                <button id="repeatBtn" type="button">
                    🔁
                </button>

            </div>

            <!-- VOLUME -->
            <div class="volume">
                <span>🔊</span>

                <input
                    type="range"
                    id="volume"
                    min="0"
                    max="1"
                    step="0.01"
                    value="1"
                >
            </div>

        </section>


        <!-- MUSIC LIBRARY -->
        <section class="library">

            <div class="section-title">
                <h2>My Music</h2>
            </div>

            <div id="songList" class="song-list">
                <!-- Lagu akan muncul di sini -->
            </div>

        </section>

    </main>


    <!-- MINI PLAYER -->
<div id="miniPlayer" class="mini-player">

    <img id="miniCover" src="cover/default.jpg" alt="">

    <div class="mini-info">
        <strong id="miniTitle">Belum ada lagu</strong>
        <span id="miniArtist">Toki's Music</span>
    </div>

    <button id="miniPrev" type="button" aria-label="Lagu sebelumnya">
        ⏮
    </button>

    <button id="miniPlay" type="button" aria-label="Putar atau jeda">
        ▶
    </button>

    <button id="miniNext" type="button" aria-label="Lagu berikutnya">
        ⏭
    </button>

</div>
    <audio id="audio"></audio>


    <script src="script.js"></script>

</body>
</html>
